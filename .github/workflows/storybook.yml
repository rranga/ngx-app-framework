# Verifies the component library and publishes Storybook to GitHub Pages.
#
# - Pull requests: run the quality gates and build Storybook (no deployment).
# - Pushes to main (and manual runs on main): the same, then deploy to Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Storybook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job requests what it needs.
permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  # Supersede outdated PR runs, but never cancel an in-progress deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run-many -t lint -p ui-components docs-storybook

      - name: Unit tests
        run: npx nx test ui-components

      - name: Build library
        run: npx nx build ui-components

      - name: Build Storybook
        run: npx nx run docs-storybook:build-storybook:ci

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/storybook/docs-storybook

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
